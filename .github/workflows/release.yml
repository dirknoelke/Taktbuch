name: Release
# Manuell starten (Actions, Release, Run workflow) oder per Tag-Push (vX.Y.Z).
# Die Version kommt aus der Datei VERSION, das Tag wird beim Release angelegt.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Version bestimmen
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "V=$v" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "v$v" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} passt nicht zu VERSION $v"; exit 1; fi
      - run: ZW_REPO="${{ github.repository }}" python3 build.py
      - run: node tests/engine.test.js
      - name: Release-Text aus CHANGELOG.md
        run: |
          awk -v v="$V" '$0 ~ "^## "v"$" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Siehe CHANGELOG.md" > notes.md
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then echo "Release v$V existiert schon"; exit 1; fi
          gh release create "v$V" dist/zeitwerk.html --target "$GITHUB_SHA" --title "Zeitwerk $V" --notes-file notes.md
