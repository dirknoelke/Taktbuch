<style>
/* Layout: schmale Kopfleiste mit Reitern, darunter ein Arbeitsbereich in Karten; Zahlen in Mono wie auf einer Stempelkarte. */
:root{
  --bg:#EBEFF3; --surface:#FFFFFF; --surface2:#F4F6F9; --ink:#111B25; --muted:#586979; --line:#D3DAE2;
  --accent:#D9461C; --accent-ink:#FFFFFF; --accent-soft:#FBE6DF;
  --pos:#14773F; --neg:#B8321F; --warn:#9A6200;
  --t-urlaub:#DCE9FB; --t-urlaub-ink:#1D4F96; --t-za:#E8E0F7; --t-za-ink:#5A3A9C; --t-dr:#FBEFCB; --t-dr-ink:#8A6410;
  --t-krank:#FADFE6; --t-krank-ink:#9B2447; --t-feier:#DDEEE6; --t-feier-ink:#1F6B4B; --t-we:#E3E8ED; --t-we-ink:#6A7B8B;
  --c1:#2F62C8; --c2:#C97F12; --c3:#17907A; --c4:#7C4FC0; --c5:#BF3F72; --c6:#66788A;
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1319; --surface:#141E27; --surface2:#1A2631; --ink:#E6ECF2; --muted:#8C9EB0; --line:#2A3946;
  --accent:#FF7B52; --accent-ink:#1B0B05; --accent-soft:#3A2018;
  --pos:#4FC98B; --neg:#FF8F7E; --warn:#E3B04B;
  --t-urlaub:#1C3354; --t-urlaub-ink:#9CC1F5; --t-za:#2C2548; --t-za-ink:#C4B0F2; --t-dr:#3D3317; --t-dr-ink:#E8C56B;
  --t-krank:#43202B; --t-krank-ink:#F2A3BA; --t-feier:#1B3A2E; --t-feier-ink:#8FDDB9; --t-we:#1F2B36; --t-we-ink:#7D8FA1;
  --c1:#6C9BF2; --c2:#E5A845; --c3:#4CC3A9; --c4:#AD8BE6; --c5:#E57BA6; --c6:#93A5B7; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1319; --surface:#141E27; --surface2:#1A2631; --ink:#E6ECF2; --muted:#8C9EB0; --line:#2A3946;
  --accent:#FF7B52; --accent-ink:#1B0B05; --accent-soft:#3A2018;
  --pos:#4FC98B; --neg:#FF8F7E; --warn:#E3B04B;
  --t-urlaub:#1C3354; --t-urlaub-ink:#9CC1F5; --t-za:#2C2548; --t-za-ink:#C4B0F2; --t-dr:#3D3317; --t-dr-ink:#E8C56B;
  --t-krank:#43202B; --t-krank-ink:#F2A3BA; --t-feier:#1B3A2E; --t-feier-ink:#8FDDB9; --t-we:#1F2B36; --t-we-ink:#7D8FA1;
  --c1:#6C9BF2; --c2:#E5A845; --c3:#4CC3A9; --c4:#AD8BE6; --c5:#E57BA6; --c6:#93A5B7; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1120px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;letter-spacing:.005em;text-wrap:balance}
h2{font-size:20px}h3{font-size:15px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:10px 0 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-head);font-weight:700;font-size:22px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand .mark{width:26px;height:26px;flex:none;align-self:center}
.brand i{font-style:normal;font-family:var(--font-num);font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:99px}
.tabs{display:flex;gap:2px;flex-wrap:nowrap;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none}
.bar{gap:8px 12px}.brand{order:1;flex:1}.konto-pill,#helpBtn,.lang{order:2}.save{order:2;min-width:0}.tabs{order:3;flex:1 1 100%}   /* zwei Zeilen: Reiter kommen nie hinter das Zeitkonto */
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{background:var(--surface2);color:var(--ink)}
.tab[aria-current="page"]{background:var(--ink);color:var(--bg)}
.konto-pill{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;padding:2px 0}
.konto-pill small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.konto-pill b{font-family:var(--font-num);font-size:19px;font-weight:600}
.save{font-size:11px;color:var(--muted);min-width:70px;text-align:right}
.banner{margin-top:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--r);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{font-weight:600}
.banner.col{flex-direction:column;align-items:flex-start;gap:4px}.banner.col ul{margin:0 0 4px 18px;padding:0}.banner.col h4.sh{margin:6px 0 0}
details.help{border-top:1px solid var(--line);padding:8px 0}details.help summary{cursor:pointer;font-weight:600}details.help p,details.help ul{margin:8px 0 0}details.help ul{padding-left:20px}

main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h3,.card-h{margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}

.nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav h2{min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.45;cursor:default}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media(max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stat b{display:block;font-family:var(--font-num);font-size:26px;font-weight:600;line-height:1.2;margin-top:2px}
.stat span{font-size:12px;color:var(--muted)}
.meter{height:5px;background:var(--surface2);border-radius:9px;margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:9px}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>label,.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-width:0;width:100%}
input[type=time],input[type=date],input[type=number]{font-family:var(--font-num)}
input:disabled{background:var(--surface2);color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stamp{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.stamp .field{flex:1 1 120px}
.clock{font-family:var(--font-num);font-size:13px;color:var(--accent);font-weight:600}
.calc{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.calc div{display:flex;flex-direction:column}
.calc small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.calc b{font-family:var(--font-num);font-size:16px;font-weight:600}
.hint{font-size:12px;color:var(--muted)}
.btn.primary .hint{color:inherit;opacity:.85}
.swatches{display:flex;gap:10px;flex-wrap:wrap;padding:4px 0}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0;cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.sh{margin:18px 0 8px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fields:not(.wide) .field,.stamp .field{justify-content:flex-end}
.fields input,.fields select,.stamp input{min-height:36px}
.fields.wide{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.fields.cols{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));align-items:start}
.rgb{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}.rgh{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}.rgh button{margin-left:auto}
.sollv{margin-bottom:6px}.sollv table{width:auto;min-width:min(100%,520px)}.sollv button{margin-top:8px}
.warns{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.warns div{font-size:12.5px;color:var(--warn)}

.tl{position:relative;height:34px;background:var(--surface2);border-radius:7px;overflow:hidden;margin:4px 0 6px}
.tl .presence{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)}
.tl .blk{position:absolute;top:5px;bottom:5px;border-radius:4px;min-width:2px}
.tl-axis{display:flex;justify-content:space-between;font-family:var(--font-num);font-size:10.5px;color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.tablewrap{overflow-x:auto;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
td.wrapc{white-space:normal;min-width:160px}
th.r,td.r{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
tr.sel td{background:var(--accent-soft)}
tr.dim td{color:var(--muted)}
tfoot td{font-weight:600;border-top:2px solid var(--line);border-bottom:0}
td input,td select{padding:3px 5px;font-size:13px}
td input[type=time],td input.tq{width:80px}
input.tq{font-family:var(--font-num)}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.ty-Urlaub,.ty-Sonderurlaub,.ty-Urlaub-halb{background:var(--t-urlaub);color:var(--t-urlaub-ink)}
.ty-Zeitausgleich{background:var(--t-za);color:var(--t-za-ink)}
.ty-Dienstreise{background:var(--t-dr);color:var(--t-dr-ink)}
.ty-krank{background:var(--t-krank);color:var(--t-krank-ink)}
.ty-Feiertag,.ty-Betriebsfrei{background:var(--t-feier);color:var(--t-feier-ink)}
.ty-WE{background:var(--t-we);color:var(--t-we-ink)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:2px 0}
.cell{min-height:64px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;text-align:left;min-width:0}
.cell:hover{border-color:var(--ink)}
.cell .dn{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.cell .hv{font-family:var(--font-num);font-size:13px;font-weight:600}
.cell small{font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell.today{outline:2px solid var(--accent);outline-offset:-1px}
.cell.out{visibility:hidden}
.cell.planned .hv{opacity:.55;font-style:italic}
.cell.ty-Urlaub,.cell.ty-Sonderurlaub,.cell.ty-Urlaub-halb{background:var(--t-urlaub);color:var(--t-urlaub-ink)}
.cell.ty-Zeitausgleich{background:var(--t-za);color:var(--t-za-ink)}
.cell.ty-Dienstreise{background:var(--t-dr);color:var(--t-dr-ink)}
.cell.ty-krank{background:var(--t-krank);color:var(--t-krank-ink)}
.cell.ty-Feiertag,.cell.ty-Betriebsfrei{background:var(--t-feier);color:var(--t-feier-ink)}
.cell.ty-WE{background:var(--t-we);color:var(--t-we-ink)}
.cell[class*="ty-"] .dn{color:inherit;opacity:.75}
.legend i[class*="ty-"]{border:1px solid var(--line)}
@media(max-width:560px){.cell{min-height:52px;padding:3px 4px}.cell small,.cell .dn .num{display:none}}

.bars{display:flex;flex-direction:column;gap:7px}
.barrow{display:grid;grid-template-columns:minmax(80px,170px) minmax(0,1fr) 78px;gap:10px;align-items:center;font-size:13px}
.barrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barrow .tr{height:12px;background:var(--surface2);border-radius:4px;overflow:hidden}
.barrow .tr i{display:block;height:100%;border-radius:4px}
.chartbox{position:relative}

.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;z-index:50;font-size:13px;max-width:90vw}
.report{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px}
.report li{margin:2px 0}
/* Urlaubsplaner */
.pms{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px 18px}
.pm{min-width:0}.pmh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.pg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;user-select:none;-webkit-user-select:none}
.pg i{font-style:normal;font-size:10px;text-align:center;color:var(--muted)}
.pd{aspect-ratio:1;min-width:0;border:1px solid transparent;border-radius:6px;background:var(--surface2);font-family:var(--font-num);font-size:12px;padding:0;cursor:pointer;position:relative;color:var(--ink)}
.pd[data-p]:hover{border-color:var(--ink)}
.pd:not([data-p]){cursor:default}
.pd sup{font-size:8px;position:absolute;right:2px;top:0;line-height:1.2}
.pd.today{outline:2px solid var(--accent);outline-offset:1px}
.pd.fut{border:1px dashed currentColor}
.pd[class*="ty-"]{background:var(--surface2)}
.pd.ty-Urlaub,.pd.ty-Sonderurlaub,.pd.ty-Urlaub-halb{background:var(--t-urlaub);color:var(--t-urlaub-ink)}
.pd.ty-Zeitausgleich{background:var(--t-za);color:var(--t-za-ink)}
.pd.ty-Dienstreise{background:var(--t-dr);color:var(--t-dr-ink)}
.pd.ty-krank{background:var(--t-krank);color:var(--t-krank-ink)}
.pd.ty-Feiertag,.pd.ty-Betriebsfrei{background:var(--t-feier);color:var(--t-feier-ink)}
.pd.ty-WE{background:transparent;color:var(--t-we-ink)}
@media(prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
</style>

<script>
// Stunden engine: pure functions, no DOM. Port of the Excel rules.
(function (root) {
  const DEFAULTS = {
    soll: 7.5,            // Sollstunden pro Arbeitstag (aktuell)
    sollAlt: null,        // Soll vor dem Wechseldatum (z. B. Teilzeit), null = kein Wechsel
    sollWechsel: '',      // Wechseldatum YYYY-MM-DD
    urlaubJahr: 30,       // Urlaubstage, werden am 1.1. gutgeschrieben
    tagesMax: 10,         // max. anrechenbare Stunden pro Tag
    kappungTag: '10-31',  // Stichtag Kappung Zeitkonto (MM-TT) oder ''
    kappungMax: 10,       // max. Saldo nach Stichtag
    startSaldo: 0,        // Zeitkonto vor erstem Datum
    startUrlaub: 0,       // Resturlaub vor erstem Datum
    startDatum: '2020-01-01',
    urlaubVerfall: '05-01', // MM-TT: nicht genommener Vorjahresurlaub verfällt
    urlaubVerfallAb: 2025,  // alt: wird beim Laden in eine Regel mit Datum umgewandelt
    ortAn: false,           // Arbeitsort (Buero/Homeoffice) erfassen
    standardOrt: 'buero',   // 'buero' | 'ho'
    hoWochentage: [],       // feste Homeoffice-Wochentage (1=Mo ... 5=Fr)
    auszahlAn: false,       // Auszahlung von Ueberstunden erfassen
    pauseModus: 'gesetz',   // automatische Pause: 'gesetz' | 'fest' | 'keine'
    pauseAb: 6,             // bei 'fest': ab dieser Anwesenheit (h)
    pauseFest: 1,           // bei 'fest': Pause (h)

window.__ZW_VERSION='1.12.1';window.__ZW_REPO='nullpointer-ruhr/Taktbuch';window.__ZW_TARGET='offline';window.ZW_HELP={"de": {"title": "Hilfe zu Taktbuch", "intro": "Taktbuch führt dein Zeitkonto, deinen Urlaub und deine Tätigkeiten. Alles liegt in deinem Browser, nichts wird an einen Server gesendet. Diese Hilfe ist Teil der Datei und funktioniert offline.", "sections": [{"h": "Der Tag in Kürze", "p": ["Unter **Heute** trägst du Kommen und Gehen ein. Die Pause wird automatisch abgezogen, bis du sie für den Tag selbst einträgst. Das **Zeitkonto** ist die Summe aller Tage: gearbeitete Stunden minus Soll."], "li": ["Urlaub, Feiertag, Krankheit und Zeitausgleich ändern das Konto nicht, weil das Soll des Tages dann als erfüllt gilt.", "Zeiten, die an einem Urlaubstag (auch Sonderurlaub, Betriebsfrei) eingetragen sind, werden ignoriert. Die App weist am Tag darauf hin.", "Tage in der Zukunft ohne Zeiten gelten als Plan und belasten das Konto nicht."]}, {"h": "Tätigkeiten und Timer", "p": ["Unter **Tätigkeiten** buchst du, woran du gearbeitet hast: von bis oder Dauer, dazu Kategorie, Art, System, Projektnummer und Thema. Mit dem Timer startest du eine Tätigkeit, die bis zum Stopp mitläuft."], "li": ["Wer ein Thema eingibt, bekommt Kategorie, Art und System aus dem letzten Eintrag mit demselben Thema vorgeschlagen (nur leere Felder werden gefüllt).", "Nach „Hinzufügen“ werden die Felder geleert.", "Welche Spalten du siehst, stellst du unter Einstellungen, Erfassung ein."]}, {"h": "Woche und Monat", "p": ["In der **Woche** änderst du Zeiten direkt in der Tabelle. Die Wochensumme rechnet wie das Konto: halbe Urlaubstage (24.12. und 31.12.) zählen nur dann mit halbem Soll, wenn du an dem Tag arbeitest.", "Der **Monat** zeigt alle Tage als Kalender. Mit dem Zeitraum-Werkzeug setzt du mehrere Tage auf einmal auf Urlaub, Zeitausgleich, Dienstreise oder einen Arbeitsort."]}, {"h": "Kalender: Urlaub und Zeitausgleich planen", "p": ["Im **Kalender** wählst du einen Pinsel (Urlaub, Urlaub halb, Zeitausgleich, Dienstreise) und klickst oder ziehst über die Tage. Ein zweiter Klick auf einen belegten Tag nimmt ihn zurück. Oben siehst du Anspruch, genommen, geplant und den Resturlaub, darunter den Verlauf über das Jahr."], "li": ["Verfall und Übertrag ins Langzeitkonto richten sich nach den Regeln unter Einstellungen, Urlaub und Konto.", "Die Kappung des Zeitkontos wird im Kalender mit einer Warnung angezeigt, wenn nach der aktuellen Planung Stunden verfallen würden."]}, {"h": "Auswertung und Gehalt", "p": ["Die **Auswertung** zeigt Monats- und Jahrestabellen, Auswertungen nach Kategorie, Art und System sowie (wenn eingeschaltet) Arbeitsort und Dienstreisen für die Steuererklärung. Das ist eine reine Zählung, keine Steuerberechnung.", "Unter **Gehalt** siehst du die Gehaltsübersicht mit Gehaltserhöhung und Zahltag."]}, {"h": "Einstellungen im Überblick", "li": ["**Arbeitszeit:** Soll pro Tag (mit Änderungen ab Datum), Pausenregel, Bundesland für Feiertage.", "**Urlaub und Konto:** Urlaubstage, 24.12. und 31.12., Verfall, Langzeitkonto, Kappung. Änderungen gelten ab einem Datum, frühere Zeiträume behalten ihre Regeln. Hier startet auch der Jobwechsel-Assistent.", "**Gehalt:** Angaben für die Gehaltsansicht und den Zahltag.", "**Erfassung:** Spalten der Tätigkeiten, Arbeitsort, Auszahlung von Überstunden, Dienstreise (Kunde und Ort).", "**Allgemein:** Anzeige und Rundung der Zeiten.", "**Daten:** Sicherung, Wiederherstellung, Excel-Import, automatische Sicherung, Version und Updates."]}, {"h": "Jobwechsel", "p": ["Beim Wechsel mitten im Jahr startest du den Assistenten unter Einstellungen, Urlaub und Konto. Er fragt Datum, Urlaubstage, Resturlaub bis Jahresende, Startwerte für Konto und Langzeitkonto und das neue Soll ab. Der alte Job zählt anteilig in halben Monaten (1. bis 15. = halber Monat), aufgerundet auf halbe Tage. Alles davor bleibt unverändert."]}, {"h": "Arbeitsort, Auszahlung und Dienstreise", "p": ["Diese Funktionen sind standardmäßig aus und werden unter Einstellungen, Erfassung eingeschaltet. **Arbeitsort** zählt Büro und Homeoffice je Tag, auch geteilte Tage (erst Büro, dann Homeoffice oder umgekehrt, mit Umschaltzeit). **Auszahlung** zieht ausgezahlte Überstunden vom Konto ab. Bei einer **Dienstreise** trägst du Kunde und Ort ein."]}, {"h": "Sicherung und Updates", "p": ["Deine Daten liegen nur in diesem Browser. Speichere deshalb regelmäßig eine Sicherung unter Einstellungen, Daten. In Chrome und Edge kannst du dort einen Ordner für die **automatische Sicherung** wählen (zum Beispiel in OneDrive). Taktbuch behält die letzten Dateien und lässt andere Dateien im Ordner in Ruhe.", "Bei einem **Update** erscheint oben ein Hinweis. „Installieren“ überschreibt die Datei, die du gerade geöffnet hast, nach Bestätigung. Speichere vorher eine Sicherung, benenne die Datei nicht um und verschiebe sie nicht."]}, {"h": "Sprache, Problem melden", "p": ["Oben rechts schaltest du zwischen Deutsch und Englisch um. Unter Einstellungen, Daten findest du „Problem melden / Wunsch senden“. Das öffnet dein Mailprogramm mit vorbefülltem Text (Version, Browser, aktive Schalter). Es wird nichts automatisch gesendet und keine Daten aus der App."]}]}, "en": {"title": "Taktbuch help", "intro": "Taktbuch tracks your time account, vacation and activities. Everything stays in your browser, nothing is sent to a server. This help is part of the file and works offline.", "sections": [{"h": "The day in brief", "p": ["On **Today** you enter start and end. The break is deducted automatically until you enter one for the day yourself. The **time account** is the sum of all days: hours worked minus target."], "li": ["Vacation, public holiday, sick leave and time off in lieu do not change the account, because the day's target counts as met.", "Times entered on a vacation day (also special leave, company closed) are ignored. The app points this out on the day.", "Future days without times count as plan and do not burden the account."]}, {"h": "Activities and timer", "p": ["Under **Activities** you log what you worked on: from to or duration, plus category, type, system, project number and topic. The timer starts an activity that keeps running until you stop it."], "li": ["When you enter a topic, category, type and system are suggested from the latest entry with the same topic (only empty fields are filled).", "After \"Add\" the fields are cleared.", "Which columns you see is set under Settings, Recording."]}, {"h": "Week and month", "p": ["In the **week** you change times directly in the table. The weekly total works like the account: half vacation days (24 Dec and 31 Dec) only count with half the target if you work that day.", "The **month** shows all days as a calendar. With the period tool you set several days at once to vacation, time off in lieu, business trip or a work location."]}, {"h": "Calendar: plan vacation and time off", "p": ["In the **Calendar** pick a brush (vacation, half vacation, time off in lieu, business trip) and click or drag across days. A second click on a marked day removes it. At the top you see entitlement, taken, planned and remaining vacation, below it the course over the year."], "li": ["Expiry and carry-over to the long-term account follow the rules under Settings, Vacation and account.", "If the planning would make hours of the time account expire because of the cap, the calendar shows a warning."]}, {"h": "Reports and salary", "p": ["**Reports** shows monthly and yearly tables, breakdowns by category, type and system and (if switched on) work location and business trips for your tax return. This is a plain count, not a tax calculation.", "**Salary** shows the salary overview with pay rise and payday."]}, {"h": "Settings overview", "li": ["**Working time:** daily target (changes from a date), break rule, state for public holidays.", "**Vacation and account:** vacation days, 24 Dec and 31 Dec, expiry, long-term account, cap. Changes apply from a date, earlier periods keep their rules. The job change wizard starts here.", "**Salary:** inputs for the salary view and the payday.", "**Recording:** activity columns, work location, overtime payout, business trip (customer and place).", "**General:** display and rounding of times.", "**Data:** backup, restore, Excel import, automatic backup, version and updates."]}, {"h": "Job change", "p": ["When you change jobs in the middle of a year, start the wizard under Settings, Vacation and account. It asks for the date, vacation days, vacation left until year end, starting values for account and long-term account and the new target. The old job counts pro rata in half months (1st to 15th = half a month), rounded up to half days. Everything before stays unchanged."]}, {"h": "Work location, payout and business trip", "p": ["These are off by default and switched on under Settings, Recording. **Work location** counts office and home office per day, including split days (office first then home office or the other way round, with a switch time). **Payout** deducts paid-out overtime from the account. For a **business trip** you enter customer and place."]}, {"h": "Backup and updates", "p": ["Your data lives only in this browser. Save a backup regularly under Settings, Data. In Chrome and Edge you can pick a folder there for the **automatic backup** (for example in OneDrive). Taktbuch keeps the latest files and leaves other files in the folder alone.", "When an **update** is available a notice appears at the top. \"Install\" overwrites the file you currently have open, after confirmation. Save a backup first, do not rename the file and do not move it."]}, {"h": "Language, report a problem", "p": ["Switch between German and English at the top right. Under Settings, Data you find \"Report a problem / send a request\". It opens your mail program with prefilled text (version, browser, active switches). Nothing is sent automatically and no data from the app."]}]}};window.ZW_WHATS={"1.12.1": {"de": ["Fehler behoben: Liegt das Startdatum in der aktuellen Woche oder in der Zukunft (neues Konto), ließen sich Heute, Woche und Kalender nicht öffnen. Tage vor dem Startdatum zeigen jetzt einen Hinweis.", "Stichtage für Urlaubsverfall und Kappung werden als Tag.Monat eingegeben und angezeigt (z. B. 01.05.). Versehentlich so gespeicherte Werte werden automatisch übernommen."], "en": ["Fixed: if the start date was in the current week or in the future (new account), Today, Week and Calendar could not be opened. Days before the start date now show a note.", "Cut-off dates for vacation expiry and cap are entered and shown as day.month (e.g. 01.05.). Values accidentally saved that way are converted automatically."]}, "1.12.0": {"de": ["Farbe und Darstellung wählbar: unter „Einstellungen“ → „Allgemein“ acht Akzentfarben und hell, dunkel oder automatisch.", "Im dunklen Design ist die Beschreibung auf hervorgehobenen Knöpfen jetzt gut lesbar."], "en": ["Choose color and appearance: under \"Settings\" → \"General\" eight accent colors and light, dark or automatic.", "In the dark theme the description on highlighted buttons is now easy to read."]}, "1.11.4": {"de": ["Fehler behoben: Der Reiter „Einstellungen“ wurde oben von der Zeitkonto-Anzeige verdeckt. Die Reiter stehen jetzt immer in einer eigenen Zeile.", "Nach einem Update zeigt „Was ist neu“ bis zu sechs übersprungene Versionen statt drei."], "en": ["Fixed: the \"Settings\" tab was partly hidden behind the time account display at the top. The tabs now always sit in their own row.", "After an update \"What's new\" shows up to six skipped versions instead of three."]}, "1.11.3": {"de": ["Fehler behoben: „Problem melden / Wunsch senden“ nutzt jetzt die richtige Mailadresse (Taktbuch@pm.me)."], "en": ["Fixed: \"Report a problem / send a request\" now uses the correct mail address (Taktbuch@pm.me)."]}, "1.11.2": {"de": ["Korrektur: Zeitausgleich-Tage rechnen wieder wie zuvor; nur Urlaub, Sonderurlaub und Betriebsfrei ignorieren eingetragene Zeiten."], "en": ["Correction: time off in lieu days calculate as before; only vacation, special leave and company closed ignore entered times."]}, "1.11.1": {"de": ["An Urlaubstagen (auch Sonderurlaub und Betriebsfrei) werden eingetragene Zeiten ignoriert und ändern das Zeitkonto nicht mehr. Zeitausgleich ist davon nicht betroffen."], "en": ["On vacation days (also special leave and company closed) entered times are ignored and no longer change the time account. Time off in lieu is not affected."]}, "1.11.0": {"de": ["**Hilfe** in der App: oben rechts auf „Hilfe“. Läuft offline und gibt es auch als Datei im Repository.", "Nach einem Update zeigt Taktbuch **Was ist neu** (diese Übersicht). Du findest sie jederzeit in der Hilfe.", "Der Reiter „Urlaub“ heißt jetzt **Kalender**.", "Fehler behoben: Die Wochensumme zählt halbe Urlaubstage (24.12. und 31.12.) jetzt wie das Zeitkonto und zeigt kein falsches Minus mehr.", "Hinweis am Tag, wenn an einem freien Tag Zeiten eingetragen sind."], "en": ["**Help** in the app: click \"Help\" at the top right. Works offline and is also available as a file in the repository.", "After an update Taktbuch shows **What's new** (this overview). You can open it any time from the help.", "The \"Vacation\" tab is now called **Calendar**.", "Fixed: the weekly total now counts half vacation days (24 Dec and 31 Dec) like the time account and no longer shows a wrong minus.", "Notice on the day when times are entered on a day off."]}, "1.10.0": {"de": ["Einstellungen sind in **Untermenüs** gegliedert: Arbeitszeit, Urlaub und Konto, Gehalt, Erfassung, Allgemein, Daten.", "Die **automatische Pause** ist einstellbar (gesetzliche Staffel, feste Pause ab Mindestanwesenheit oder keine), gültig ab einem Datum.", "**Automatische Sicherung** in einen Ordner deiner Wahl (Chrome, Edge), sonst eine wöchentliche Erinnerung.", "**Dienstreise** mit Kunde und Ort, inklusive Jahrestabelle in der Auswertung."], "en": ["Settings are split into **sub-menus**: Working time, Vacation and account, Salary, Recording, General, Data.", "The **automatic break** is configurable (statutory scale, fixed break from a minimum presence, or none), valid from a date.", "**Automatic backup** into a folder of your choice (Chrome, Edge), otherwise a weekly reminder.", "**Business trip** with customer and place, including a yearly table in Reports."]}, "1.9.0": {"de": ["Die App heißt jetzt **Taktbuch** (vorher Zeitwerk). Deine Daten bleiben erhalten.", "Neuer Knopf **Problem melden / Wunsch senden** unter Einstellungen, Daten."], "en": ["The app is now called **Taktbuch** (formerly Zeitwerk). Your data stays.", "New button **Report a problem / send a request** under Settings, Data."]}, "1.8.0": {"de": ["**Arbeitsort** je Tag (Büro, Homeoffice, geteilt) mit Jahrestabelle für die Steuererklärung.", "**Auszahlung von Überstunden** je Tag, vom Konto abgezogen.", "Fehler behoben: Kategorie, Art und System werden nach „Hinzufügen“ nicht mehr übernommen; Update-Hinweis erscheint früher."], "en": ["**Work location** per day (office, home office, split) with a yearly table for your tax return.", "**Overtime payout** per day, deducted from the account.", "Fixed: category, type and system are no longer carried over after \"Add\"; the update notice appears sooner."]}, "1.7.0": {"de": ["**Jobwechsel-Assistent** unter Einstellungen, Urlaub und Konto.", "Urlaubsregeln, 24.12. und 31.12., Verfall und Kappung gelten **ab einem Datum**."], "en": ["**Job change wizard** under Settings, Vacation and account.", "Vacation rules, 24 Dec and 31 Dec, expiry and cap apply **from a date**."]}};

  'Urlaub und Zeitkonto': 'Vacation and time account', 'Ab Startdatum <WD> #': 'From start date <WD> #',
  'Diese Regeln gelten jeweils ab einem Datum. Eine Änderung wirkt nur ab ihrem Datum, Urlaub, Zeitkonto und Auswertungen davor bleiben wie erfasst. Lege für eine neue Regel eine Änderung mit Datum an und ändere nicht die alte Zeile. Urlaubstage pro Jahr werden am 01.01. gutgeschrieben, eine Änderung mitten im Jahr greift also ab dem nächsten 01.01.': 'These rules each apply from a date. A change only takes effect from its date; vacation, time account and reports before it stay as recorded. For a new rule add a change with a date instead of editing the old row. Vacation days per year are credited on 01.01., so a change in mid-year applies from the next 01.01.',

  'Alles darüber zählt als Überzeit und nicht fürs Konto. Wirkt auf alle Tage, auch vergangene.': 'Anything above counts as overtime and not towards the balance. Applies to all days, including past ones.',
  'An diesem Tag wird das Zeitkonto auf den Wert unten gekappt. Leer = keine Kappung. Wirkt auf alle Jahre, das Zeitkonto vergangener Jahre ändert sich.': 'On this day the time balance is capped to the value below. Empty = no cap. Applies to all years, the balance of past years changes.',
  'Angerechnet werden höchstens # h pro Tag. Der Rest erscheint als „Über # h“ in der Jahresübersicht.': 'At most # h per day are credited. The rest shows as “Over # h” in the yearly overview.',
  'Echte Erhöhungen trägst du direkt in „Gehalt“ ein (Brutto des Monats). Ab diesem Monat rechnet die Prognose mit dem neuen Wert weiter. Erfasste Gehaltsmonate ändern sich durch diese Einstellungen nicht.': 'Enter real raises directly under “Salary” (gross of the month). From that month the forecast continues with the new value. Recorded salary months are not changed by these settings.',
  'Ein neues Soll gilt nur ab dem Datum. Zeitkonto, Krankheitsquote, Urlaub halb und alle Auswertungen davor bleiben wie erfasst. Wenn du die Arbeitszeit änderst, lege also eine neue Zeile mit dem Datum an und ändere nicht den alten Wert, sonst wird die Vergangenheit neu gerechnet. Das Soll gilt je Arbeitstag, bei # Tagen die Woche siehst du rechts die Wochenstunden.': 'A new target only applies from its date. Time balance, sick rate, half vacation days and all reports before it stay as recorded. If your working time changes, add a new row with the date instead of changing the old value, otherwise the past is recalculated. The target applies per working day, with # days per week you see the weekly hours on the right.',
  'Erster Tag der Rechnung. Frühere Einträge werden nicht gewertet.': 'First day of the calculation. Earlier entries are not counted.',

   Unverändert aus 1-kern.js übernommen. Datenbanknamen je Profil (PROFILES[..].db) und
   Object-Store "kv" bleiben gleich, damit bestehende Daten weiter gefunden werden.

};

      </div>

      <div class="field" style="margin-top:12px"><label for="d_n">Notiz</label><input id="d_n" type="text" value="${esc(d.n || '')}" data-f="day:n"></div>
      <div class="calc">
        <div><small>Anwesend</small><b>${d.s && d.e ? fmtT(Math.max(0, H(d.e) - H(d.s))) : live ? fmtT(live.dur) : '–'}</b></div>
        <div><small>Pause</small><b>${(d.s && d.e) || live ? fmtT(live ? live.pause : row.pause) : '–'}${d.p ? '' : ' <span class="hint">auto</span>'}</b></div>
        <div><small>Saldo Tag</small><b class="${cls(row.za - row.zagen)}">${row.planned ? '–' : fmtT(row.za - row.zagen, true)}</b></div>
        ${d.s && !d.e && isWorkType(row.t) ? `<div><small>Soll erreicht um</small><b>${sollEnde(d) ? HM(sollEnde(d)) : '–'}</b></div>` : ''}
      </div>
      ${warns.length ? `<div class="warns">${warns.map(w => `<div>⚠ ${esc(w)}</div>`).join('')}</div>` : ''}
    </section>
    <section class="card">
      <div class="card-h"><h3>Tagesverlauf</h3><span class="hint">Schraffur: anwesend · Blöcke: Tätigkeiten</span></div>
      ${timeline(k, acts, d)}
      <div class="legend" style="margin-top:8px">${[...new Set(acts.map(a => a.cat))].map(c => `<span><i style="background:${catColor(c)}"></i>${esc(c || 'ohne Kategorie')}</span>`).join('') || '<span>Noch keine Tätigkeiten erfasst.</span>'}</div>
      ${acts.length ? `<div class="calc"><div><small>Erfasst</small><b>${fmtT(row.acts)}</b></div><div><small>Arbeitszeit</small><b>${fmtT(row.stunden)}</b></div><div><small>Erfassungsrate</small><b>${row.stunden > 0 ? Math.round((row.acts / row.stunden) * 100) + ' %' : '–'}</b></div></div>` : ''}
    </section>
  </div>
  <section class="card">
    <div class="card-h"><h3>Tätigkeiten am ${fmtShort(k)}</h3><span class="hint">${acts.length} Einträge · ${fmtT(acts.reduce((a, x) => a + netto(x), 0))} h</span></div>
    <div class="tablewrap"><table>
      <thead><tr><th>Von</th><th>Bis</th><th>Unterbr.</th><th class="r">Netto</th>${['cat', 'w', 'sys', 'pn'].filter(colOn).map(f => `<th>${esc(colN(f))}</th>`).join('')}<th>${esc(colN('th'))}</th><th></th></tr></thead>
      <tbody>

        <td><input${tAttr(true)} value="${esc(a.u || '')}" data-f="act:${a.id}:u" aria-label="Unterbrechung"></td>
        <td class="r num">${a.e ? fmtT(netto(a)) : '–'}</td>
        ${colOn('cat') ? `<td><input list="dl-cat" value="${esc(a.cat)}" data-f="act:${a.id}:cat" style="min-width:70px" aria-label="${esc(colN('cat'))}"></td>` : ''}
        ${colOn('w') ? `<td><input list="dl-w" value="${esc(a.w)}" data-f="act:${a.id}:w" style="min-width:90px" aria-label="${esc(colN('w'))}"></td>` : ''}
        ${colOn('sys') ? `<td><input list="dl-sys" value="${esc(a.sys)}" data-f="act:${a.id}:sys" style="min-width:90px" aria-label="${esc(colN('sys'))}"></td>` : ''}
        ${colOn('pn') ? `<td><input list="dl-pn" value="${esc(a.pn || '')}" data-f="act:${a.id}:pn" style="min-width:80px" aria-label="${esc(colN('pn'))}"></td>` : ''}
        <td><input list="dl-th" value="${esc(a.th)}" data-f="act:${a.id}:th" style="min-width:110px;width:100%" aria-label="${esc(colN('th'))}"></td>

      <tr id="addRow" style="background:var(--surface2)">

}

/* ---------- Woche ---------- */
function viewWoche() {
  const ws = weekStart(UI.date), rows = []; for (let i = 0; i < 7; i++) rows.push(dayRow(E.addDays(ws, i)));
  const sum = f => rows.reduce((a, r) => a + f(r), 0);
  const ist = sum(wkIst), soll = sum(wkSoll);
  const kw = rows[0].kw, last = rows[6];
  return `
  <div class="nav"><button class="btn" data-a="day" data-n="-7" aria-label="Vorige Woche">‹</button>
    <h2>KW ${kw} <span class="muted" style="font-size:14px">${fmtShort(rows[0].k)} – ${fmtShort(last.k)}${last.k.slice(0, 4)}</span></h2>
    <button class="btn" data-a="day" data-n="7" aria-label="Nächste Woche">›</button><button class="btn" data-a="today">Diese Woche</button></div>
  <section class="card"><div class="tablewrap"><table>
    <thead><tr><th>Tag</th><th>Art</th><th>Kommen</th><th>Gehen</th><th class="r">Pause</th><th class="r">Stunden</th><th class="r">Saldo</th><th class="r">Zeitkonto</th><th class="r">Erfasst</th></tr></thead>
    <tbody>${rows.map(r => {
      const d = S.days[r.k] || {}, we = r.wd >= 6;
      return `<tr class="${r.k === todayKey() ? 'sel' : ''} ${we && !r.stunden ? 'dim' : ''}">
        <td><a href="#" data-a="goto" data-k="${r.k}" style="color:inherit;font-weight:600">${fmtShort(r.k)}</a> ${r.hol ? `<span class="hint">${esc(r.hol)}</span>` : ''}</td>
        <td><select data-f="day:t" data-k="${r.k}" aria-label="Art ${r.k}">${TYPE_OPTS.map(([v, l]) => opt(v, l, d.t === 'arbeit' ? '' : (d.t || (E.defaultType(r.k, S.cfg) !== 'arbeit' ? E.defaultType(r.k, S.cfg) : '')))).join('')}</select>${r.planned ? ' <span class="chip ty-WE">Plan</span>' : ''}</td>
        <td><input ${tAttr()} value="${esc(d.s || '')}" data-f="day:s" data-k="${r.k}" aria-label="Kommen ${r.k}"></td>
        <td><input ${tAttr()} value="${esc(d.e || '')}" data-f="day:e" data-k="${r.k}" aria-label="Gehen ${r.k}"></td>
        <td class="r num">${d.s && d.e ? fmtT(r.pause) : ''}</td>
        <td class="r num"><b>${r.stunden ? fmtT(r.stunden) : ''}</b></td>
        <td class="r num ${r.planned ? 'muted' : cls(r.za - r.zagen)}">${r.planned || (we && !r.stunden) ? '' : fmtT(r.za - r.zagen, true)}</td>
        <td class="r num">${fmtT(r.konto)}</td>
        <td class="r num ${r.acts ? '' : 'muted'}">${r.acts ? fmtT(r.acts) : ''}</td></tr>`;
    }).join('')}</tbody>
    <tfoot><tr><td colspan="5">Woche</td><td class="r num">${fmtT(ist)}</td><td class="r num ${cls(ist - soll)}" title="Stunden minus Soll">${fmtT(ist - soll, true)}</td><td class="r num">${fmtT(last.konto)}</td><td class="r num">${fmtT(sum(r => r.acts))}</td></tr></tfoot>
  </table></div><p class="hint" style="margin:10px 0 0">Soll der Woche: ${fmtT(soll)} h (ohne Urlaub, Feiertage, Zeitausgleich, Krankheit). Zeiten direkt in der Tabelle ändern.</p></section>`;
}

/* ---------- Monat ---------- */
function viewMonat() {
  const y = UI.year, m = UI.month, n = monthDays(y, m), first = E.key(y, m, 1), off = E.weekday(first) - 1;
  const Y = R.years[y], M = Y && Y.months[m - 1], t = todayKey();
  let cells = WD.map(w => `<div class="dh">${w}</div>`).join('');
  for (let i = 0; i < off; i++) cells += '<div class="cell out"></div>';
  for (let d = 1; d <= n; d++) {
    const k = E.key(y, m, d), r = dayRow(k); if (!r) { cells += '<div class="cell out"></div>'; continue; }
    const drl = r.t === 'Dienstreise' ? [drOn('kd') && r.kd, drOn('ot') && r.ot].filter(Boolean).join(' · ') : '';
    const lbl = drl || (r.hol && r.t === 'Feiertag' ? r.hol : r.t === 'WE' ? '' : !isWorkType(r.t) ? tyLabel(r.t) : r.t !== 'arbeit' ? r.t : '');
    cells += `<button class="cell ${tyClass(r.t)} ${k === t ? 'today' : ''} ${r.planned ? 'planned' : ''}" data-a="goto" data-k="${k}" title="${esc(fmtDate(k) + (drl ? ' · ' + drl : ''))}">
      <span class="dn"><span>${d}${paydayOf(y, m) === k ? ' <b title="Zahltag" style="color:var(--accent)">€</b>' : ''}</span>${r.acts ? `<span class="num">${fmtDec(r.acts, 1)}</span>` : ''}</span>
      <span class="hv">${r.stunden ? fmtT(r.stunden) : '&nbsp;'}</span><small>${esc(lbl || (r.ort ? { buero: 'Büro', ho: 'HO', mix: 'Büro/HO', dr: '' }[r.ort] : ''))}</small></button>`;
  }
  const rg = UI.range;
  return `
  <div class="nav"><button class="btn" data-a="mon" data-n="-1" aria-label="Voriger Monat">‹</button><h2>${MONL[m - 1]} ${y}</h2>
    <button class="btn" data-a="mon" data-n="1" aria-label="Nächster Monat">›</button><button class="btn" data-a="todayMon">Heute</button></div>
  ${M ? `<div class="stats">
    <div class="stat"><small>Stunden</small><b>${fmtT(M.stunden)}</b><span>Soll ${fmtT(M.soll)} h</span></div>
    <div class="stat"><small>Zeitkonto Monatsende</small><b class="${cls(M.konto)}">${fmtT(M.konto, true)}</b><span>${M.zaTage ? M.zaTage + ' Tage Zeitausgleich' : 'kein Zeitausgleich'}</span></div>
    <div class="stat"><small>Urlaub / Krank</small><b>${fmtDec(M.urlaub, M.urlaub % 1 ? 1 : 0)} / ${fmtDec(M.krank, M.krank % 1 ? 1 : 0)}</b><span>Tage · Rest ${fmtDec(M.rest, M.rest % 1 ? 1 : 0)}</span></div>
    <div class="stat"><small>Erfassungsrate</small><b>${M.rate == null ? '–' : Math.round(M.rate * 100) + ' %'}</b><span>${fmtT(M.netto)} h in Tätigkeiten</span></div></div>` : ''}
  <section class="card"><div class="cal">${cells}</div>
    <div class="legend" style="margin-top:12px">${[['Urlaub', 'Urlaub'], ['Zeitausgleich', 'Zeitausgleich'], ['Dienstreise', 'Dienstreise'], ['krank', 'Krank'], ['Feiertag', 'Feiertag'], ['WE', 'Wochenende']].map(([c, l]) => `<span><i class="${tyClass(c)}"></i>${l}</span>`).join('')}<span>Kursiv: Plan, noch nicht erfasst</span></div></section>
  <section class="card"><div class="card-h"><h3>Zeitraum eintragen</h3><span class="hint">Wochenenden und Feiertage werden übersprungen.</span></div>
    <div class="fields" style="align-items:end">
      <div class="field"><label for="r_from">Von</label><input id="r_from" type="date" value="${rg.from}" data-f="range:from"></div>
      <div class="field"><label for="r_to">Bis</label><input id="r_to" type="date" value="${rg.to}" data-f="range:to"></div>
      <div class="field"><label for="r_t">Art</label><select id="r_t" data-f="range:t">${TYPE_OPTS.slice(1, 8).map(([v, l]) => opt(v, l, rg.t)).join('')}</select></div>
      ${rg.t === 'Dienstreise' ? ['kd', 'ot'].filter(drOn).map(f => `<div class="field"><label for="r_${f}">${esc(drName(f))}</label><input id="r_${f}" type="text" list="dl-dr${f}" value="${esc(rg[f] || '')}" data-f="range:${f}"></div>`).join('') + drList('kd') + drList('ot') : ''}
      <div><button class="btn primary" data-a="applyRange">Eintragen</button> <button class="btn" data-a="clearRange">Zurücksetzen</button></div>
    </div></section>
  ${S.cfg.ortAn ? `<section class="card"><div class="card-h"><h3>Arbeitsort für Zeitraum</h3><span class="hint">Nutzt Von und Bis von oben. Geteilte Tage stellst du pro Tag unter Heute ein.</span></div>
    <div class="fields" style="align-items:end">
      <div class="field"><label for="r_o">Ort</label><select id="r_o" data-f="range:o">${opt('buero', 'Büro', rg.o)}${opt('ho', 'Homeoffice', rg.o)}</select></div>
      <div><button class="btn primary" data-a="applyRangeOrt">Eintragen</button> <button class="btn" data-a="clearRangeOrt">Zurücksetzen</button></div>
    </div></section>` : ''}`;
}

/* ---------- Tätigkeiten ---------- */
function viewTaet() {
  const F = UI.filt, L = lists();
  const years = [...new Set(S.acts.map(a => a.d.slice(0, 4)))].sort().reverse();
  let list = S.acts.filter(a => (!F.y || a.d.startsWith(F.y)) && (!F.m || a.d.slice(5, 7) === F.m) && (!F.cat || a.cat === F.cat) && (!F.w || a.w === F.w) && (!F.sys || a.sys === F.sys) && (!F.pn || a.pn === F.pn) &&
    (!F.q || (a.th + ' ' + a.sys + ' ' + (a.pn || '') + ' ' + a.w).toLowerCase().includes(F.q.toLowerCase())));
  list.sort((a, b) => (b.d + b.s).localeCompare(a.d + a.s));
  const total = list.reduce((a, x) => a + netto(x), 0);
  const sel = (id, label, arr, cur, f) => `<div class="field"><label for="${id}">${label}</label><select id="${id}" data-f="filt:${f}"><option value="">alle</option>${arr.map(v => opt(v, v, cur)).join('')}</select></div>`;
  return `
  <div class="nav"><h2>Tätigkeiten</h2><span class="hint">${list.length} Einträge · ${fmtT(total)} h</span></div>
  <section class="card"><div class="fields" style="margin-bottom:14px">
    ${sel('fl_y', 'Jahr', years, F.y, 'y')}
    <div class="field"><label for="fl_m">Monat</label><select id="fl_m" data-f="filt:m"><option value="">alle</option>${MONL.map((n, i) => opt(pad2(i + 1), n, F.m)).join('')}</select></div>
    ${colOn('cat') ? sel('fl_c', esc(colN('cat')), L.cat, F.cat, 'cat') : ''}${colOn('w') ? sel('fl_w', esc(colN('w')), L.w, F.w, 'w') : ''}${colOn('sys') ? sel('fl_s', esc(colN('sys')), L.sys, F.sys, 'sys') : ''}${colOn('pn') ? sel('fl_p', esc(colN('pn')), L.pn, F.pn, 'pn') : ''}
    <div class="field"><label for="fl_q">Suche</label><input id="fl_q" type="search" value="${esc(F.q)}" data-f="filt:q" placeholder="${esc(colN('th'))}, ${esc(colN('sys'))} …"></div></div>
    ${list.length ? `<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Von</th><th>Bis</th><th class="r">Netto</th>${['cat', 'w', 'sys', 'pn'].filter(colOn).map(f => `<th>${esc(colN(f))}</th>`).join('')}<th>${esc(colN('th'))}</th></tr></thead><tbody>
    ${list.slice(0, F.limit).map(a => `<tr class="click" data-a="goto" data-k="${a.d}"><td class="num">${fmtShort(a.d)}${a.d.slice(2, 4)}</td><td class="num">${esc(a.s)}</td><td class="num">${esc(a.e)}</td><td class="r num">${fmtT(netto(a))}</td>
      ${colOn('cat') ? `<td><span class="legend"><i style="background:${catColor(a.cat)};margin:0 5px 0 0"></i></span>${esc(a.cat)}</td>` : ''}${colOn('w') ? `<td>${esc(a.w)}</td>` : ''}${colOn('sys') ? `<td>${esc(a.sys)}</td>` : ''}${colOn('pn') ? `<td>${esc(a.pn || '')}</td>` : ''}<td class="wrapc">${esc(a.th)}</td></tr>`).join('')}</tbody></table></div>
    ${list.length > F.limit ? `<p style="margin:12px 0 0"><button class="btn" data-a="more">Weitere ${Math.min(300, list.length - F.limit)} anzeigen</button> <span class="hint">${list.length - F.limit} ausgeblendet</span></p>` : ''}`
      : '<div class="empty">Keine Einträge für diese Filter.</div>'}
  </section>`;
}

/* ---------- Auswertung ---------- */
function pivot(dim, year) {
  const m = {}; let tot = 0;
  for (const a of S.acts) { if (year !== 'alle' && !a.d.startsWith(year)) continue; const n = netto(a); if (!n) continue; const key = a[dim] || '(leer)'; m[key] = (m[key] || 0) + n; tot += n; }
  const arr = Object.entries(m).sort((x, y) => y[1] - x[1]);
  return { arr, tot };
}
function drCard(Y, y) {
  const rows = R.rows.filter(r => r.k.slice(0, 4) === String(y) && r.t === 'Dienstreise'); if (!rows.length) return '';
  const g = {}; rows.forEach(r => { const key = [drOn('kd') ? r.kd : '', drOn('ot') ? r.ot : ''].join('\u0001'); g[key] = (g[key] || 0) + 1; });
  const list = Object.entries(g).sort((a, b) => b[1] - a[1]);
  return `<section class="card"><div class="card-h"><h3>${I18N.tx('Dienstreisen')} ${y}</h3><span class="hint">${rows.length} ${I18N.tx('Tage')}</span></div><div class="tablewrap"><table>
    <thead><tr>${drOn('kd') ? `<th>${esc(drName('kd'))}</th>` : ''}${drOn('ot') ? `<th>${esc(drName('ot'))}</th>` : ''}<th class="r">Tage</th></tr></thead>
    <tbody>${list.map(([key, n]) => { const [a, b] = key.split('\u0001'); return `<tr>${drOn('kd') ? `<td>${esc(a || '–')}</td>` : ''}${drOn('ot') ? `<td>${esc(b || '–')}</td>` : ''}<td class="r num">${n}</td></tr>`; }).join('')}</tbody></table></div></section>`;
}
function ortCard(Y, y) {
  const T = Y.tot, f = v => fmtDec(v, 0), row = (lbl, M, cls2) => `<tr class="${cls2 || ''}"><td>${lbl}</td><td class="r num">${f(M.tB)}</td><td class="r num">${f(M.tH)}</td><td class="r num">${f(M.tM)}</td><td class="r num">${f(M.tD)}</td><td class="r num">${fmtT(M.hH)}</td><td class="r num">${fmtT(M.hB)}</td></tr>`;
  return `<section class="card"><div class="card-h"><h3>Arbeitsort ${y}</h3><span class="hint">Nur Tage mit erfassten Stunden</span></div><div class="tablewrap"><table>
    <thead><tr><th>Monat</th><th class="r">Büro (Tage)</th><th class="r">Homeoffice (Tage)</th><th class="r">Geteilt (Tage)</th><th class="r">Dienstreise (Tage)</th><th class="r">Homeoffice (h)</th><th class="r">Büro (h)</th></tr></thead>
    <tbody>${Y.months.map((M, i) => row(MON[i], M, M.tB + M.tH + M.tM + M.tD ? '' : 'dim')).join('')}</tbody>
    <tfoot>${row('Jahr', T)}</tfoot></table></div>
    <p class="hint" style="margin:10px 0 0">Reine Zählung für die Steuererklärung, keine Steuerberechnung. Geteilte Tage zählen mit ihren Stunden bei Homeoffice und Büro. Dienstreisen laufen separat, ihre Stunden sind weder Büro noch Homeoffice.</p></section>`;
}
function viewAuswertung() {
  const yrs = Object.keys(R.years).map(Number).sort();
  const y = R.years[UI.year] ? UI.year : yrs[yrs.length - 1], Y = R.years[y], T = Y.tot, t = todayKey();

/* ---------- Geld ---------- */
function fmtEur(x, dp = 2) {

  if (I18N.lang === 'en') return (neg ? '−' : '') + '€' + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (parts[1] ? '.' + parts[1] : '');
  return (neg ? '−' : '') + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (parts[1] ? ',' + parts[1] : '') + ' €';

const normType = (k, v) => (v === '' && E.defaultType(k, S.cfg) !== 'arbeit' ? 'arbeit' : v);

/* Gehaltsmodell: echte Monate aus den Eingaben, spätere Monate als Prognose */
function payModel() {
  const MIR = S.cfg.mirAn !== false;
  const P = S.pay || {}, keys = Object.keys(P).sort();
  if (!keys.length) return null;
  const t = todayKey(), curYM = t.slice(0, 7), endY = +t.slice(0, 4) + 6;
  const act = keys.filter(k => P[k].u > 0 && k <= curYM).slice(-12);
  let sb = 0, sn = 0; for (const k of act) { const e = P[k]; sb += (e.b || 0) + (e.s || 0); sn += e.u + (MIR ? e.m || 0 : 0); }
  const quote = sb ? 1 - sn / sb : 0.34;
  const rows = [], byYM = {}; let prevB = null;
  for (let y = +keys[0].slice(0, 4), m = +keys[0].slice(5, 7); y <= endY;) {
    const ym = y + '-' + pad2(m), e = P[ym] || {};
    const b = e.b != null ? e.b : (prevB == null ? 0 : (m === (S.cfg.payRiseMonat == null ? 4 : S.cfg.payRiseMonat) ? (S.cfg.payRiseArt === 'eur' ? prevB + (S.cfg.payRiseEur || 0) : prevB * (1 + (S.cfg.payRise || 0))) : prevB));
    let s;
    if (e.s != null) s = e.s; else { const py = byYM[(y - 1) + '-' + pad2(m)]; s = py && py.b ? py.s * (b / py.b) : 0; }
    const hasU = e.u != null && e.u > 0;
    const netto = hasU ? e.u + (MIR ? e.m || 0 : 0) : (b + s) * (1 - quote);
    const row = { ym, y, m, b, s, bs: b + s, u: e.u, mir: MIR ? e.m || 0 : 0, netto, hasU, plan: !(e.b != null && hasU && ym <= curYM), pay: paydayOf(y, m), e };

/* ---------- Diagramme (reines SVG) ---------- */
function niceTicks(lo, hi) {

  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = []; for (let v = a; v <= b + 1e-9; v += step) t.push(+v.toFixed(6)); return t;

const SVGW = 560, SVGH = 250, ML = 46, MR = 10, MT = 10, MB = 24;
const lineStore = {};
function svgLine(id, pts, o) {

    <line id="ln_${id}" y1="${MT}" y2="${SVGH - MB}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><circle id="dt_${id}" r="4" fill="var(--c1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>

function hoverLine(id) {

    tx.textContent = L.o.tip(p); tx.setAttribute('x', px > SVGW / 2 ? px - 8 : px + 8); tx.setAttribute('text-anchor', px > SVGW / 2 ? 'end' : 'start'); tx.setAttribute('y', MT + 12);

function svgBars(vals, line, o) {

    put('chRest', svgLine('rest', pts, { aria: 'Resturlaub im Jahresverlauf', xl: p => (p.k.slice(8) === '01' ? MON[+p.k.slice(5, 7) - 1] : ''), tip: p => fmtShort(p.k) + '  ' + fmtDec(p.v, p.v % 1 ? 1 : 0) + ' Tage' })); hoverLine('rest');
  } else if (UI.tab === 'gehalt') {
    const M = payModel(); if (!M) return;
    const pts = M.rows.filter(r => r.y <= +todayKey().slice(0, 4) + 4).map(r => ({ k: r.ym, v: r.b }));
    put('chBrutto', svgLine('brutto', pts, { zero: false, aria: 'Monatsgehalt brutto im Zeitverlauf', axis: v => fmtDec(v / 1000, 1) + 'k', xl: p => (p.k.slice(5) === '01' ? p.k.slice(0, 4) : ''), tip: p => MON[+p.k.slice(5) - 1] + ' ' + p.k.slice(0, 4) + '  ' + fmtEur(p.v, 0) })); hoverLine('brutto');

  }
}

/* ---------- Gehalt ---------- */

  const M = payModel(), t = todayKey(), MIR = S.cfg.mirAn !== false;
  if (!M) return `<div class="nav"><h2>Gehalt</h2></div><section class="card"><div class="empty"><p>Noch keine Gehaltsdaten.</p><p class="hint">Beim Excel-Import wird das Blatt „Gehalt“ mitgelesen. Du kannst auch ab dem aktuellen Monat selbst beginnen.</p>
    <button class="btn primary" data-a="payStart">Aktuellen Monat anlegen</button></div></section>`;
  const years = [...new Set(M.rows.map(r => r.y))].filter(y => y <= +t.slice(0, 4) + 5);
  const y = M.rows.some(r => r.y === UI.payYear) ? UI.payYear : +t.slice(0, 4); UI.payYear = y;
  const yr = M.rows.filter(r => r.y === y);
  const next = M.rows.find(r => r.pay >= t), diff = next ? Math.round((E.toUTC(next.pay) - E.toUTC(t)) / 864e5) : 0;
  const gebucht = r => { const Y = R.years[r.y]; return Y && r.y >= +S.cfg.startDatum.slice(0, 4) && r.ym <= t.slice(0, 7) ? Y.months[r.m - 1].gebucht : 0; };
  const sum = f => yr.reduce((a, r) => a + f(r), 0);
  const brutto = sum(r => r.bs), nettoS = sum(r => r.netto), grund = sum(r => r.b);
  const stdSum = sum(r => (r.plan ? 0 : gebucht(r))), grundAct = sum(r => (r.plan ? 0 : r.b));
  const inp = (r, f, ph) => `<input type="number" step="0.01" value="${r.e[f] != null ? r.e[f] : ''}" placeholder="${ph != null ? fmtDec(ph) : ''}" data-f="pay:${r.ym}:${f}" aria-label="${f} ${r.ym}" style="width:104px;text-align:right">`;
  const yp = years.map(v => { const rr = M.rows.filter(r => r.y === v), bs = rr.reduce((a, r) => a + r.bs, 0), ne = rr.reduce((a, r) => a + r.netto, 0);
    const dec = rr.find(r => r.m === 12), prev = M.byYM[(v - 1) + '-12']; return { v, bs, ne, avg: rr.reduce((a, r) => a + r.b, 0) / rr.length, rise: dec && prev && prev.b ? dec.b / prev.b - 1 : null, plan: rr.some(r => r.plan) }; });
  return `
  <div class="nav"><h2>Gehalt</h2><div class="seg" role="group" aria-label="Jahr">${years.map(v => `<button data-a="payYear" data-v="${v}" aria-pressed="${v === y}">${v}</button>`).join('')}</div></div>
  <div class="stats">
    <div class="stat"><small>Nächster Zahltag</small><b style="font-size:21px">${next ? fmtShort(next.pay) : '–'}</b><span>${next ? (diff === 0 ? 'heute' : 'in ' + diff + ' Tagen') + ' · erwartet ' + fmtEur(next.netto, 0) : ''}</span></div>
    <div class="stat"><small>Brutto ${y}</small><b style="font-size:21px">${fmtEur(brutto, 0)}</b><span>Grundgehalt ${fmtEur(grund, 0)}</span></div>
    <div class="stat"><small>Netto ${y}</small><b style="font-size:21px">${fmtEur(nettoS, 0)}</b><span>Abzüge ${brutto ? fmtDec((1 - nettoS / brutto) * 100, 1) + ' %' : '–'}</span></div>
    <div class="stat"><small>Stundenlohn ${y}</small><b style="font-size:21px">${stdSum ? fmtEur(grundAct / stdSum) : '–'}</b><span>Grundgehalt ÷ gebuchte Stunden</span></div></div>
  <div class="grid2">
    <section class="card"><div class="card-h"><h3>Monatsgehalt brutto</h3><span class="hint">Verlauf über alle Jahre</span></div><div class="chartbox" id="chBrutto"></div></section>
    <section class="card"><div class="card-h"><h3>Netto pro Monat ${y}</h3><span class="hint">Balken: Netto · Linie: Brutto gesamt</span></div><div class="chartbox" id="chNetto"></div></section>
  </div>
  <section class="card"><div class="card-h"><h3>Monate ${y}</h3><span class="hint">Leere Felder zeigen die Prognose. Eintragen überschreibt sie.</span></div><div class="tablewrap"><table>
    <thead><tr><th>Monat</th><th>Zahltag</th><th class="r">Brutto</th><th class="r">Sonderzahlung</th><th class="r">Überwiesen</th>${MIR ? '<th class="r">MIR</th>' : ''}<th class="r">Netto</th><th class="r">Abzüge</th><th class="r">Std. gebucht</th><th class="r">€/Std</th></tr></thead>
    <tbody>${yr.map(r => { const g = gebucht(r); return `<tr class="${r.plan ? 'dim' : ''}"><td>${MON[r.m - 1]}${r.plan ? ' <span class="chip ty-WE">Plan</span>' : ''}</td><td class="num">${fmtShort(r.pay)}</td>
      <td class="r">${inp(r, 'b', r.b)}</td><td class="r">${inp(r, 's', r.s)}</td><td class="r">${inp(r, 'u', null)}</td>${MIR ? `<td class="r">${inp(r, 'm', null)}</td>` : ''}
      <td class="r num"><b>${fmtDec(r.netto)}</b></td><td class="r num">${r.bs ? fmtDec((1 - r.netto / r.bs) * 100, 1) + ' %' : ''}</td>
      <td class="r num">${!r.plan && g ? fmtT(g) : ''}</td><td class="r num">${!r.plan && g ? fmtDec(r.b / g) : ''}</td></tr>`; }).join('')}</tbody>
    <tfoot><tr><td colspan="2">Jahr</td><td class="r num">${fmtDec(grund)}</td><td class="r num">${fmtDec(sum(r => r.s))}</td><td class="r num">${fmtDec(sum(r => r.u || 0))}</td>${MIR ? `<td class="r num">${fmtDec(sum(r => r.mir))}</td>` : ''}<td class="r num">${fmtDec(nettoS)}</td><td class="r num">${brutto ? fmtDec((1 - nettoS / brutto) * 100, 1) + ' %' : ''}</td><td class="r num">${fmtT(stdSum)}</td><td class="r num">${stdSum ? fmtDec(grundAct / stdSum) : ''}</td></tr></tfoot></table></div>
    <p class="hint" style="margin:10px 0 0">${I18N.tx('Netto = überwiesen')}${MIR ? ' + MIR' : ''}. ${I18N.tx('Prognose: Brutto bleibt gleich')}${S.cfg.payRiseMonat && (S.cfg.payRiseArt === 'eur' ? S.cfg.payRiseEur : S.cfg.payRise) ? ', ' + I18N.tx('steigt im') + ' ' + MONL[S.cfg.payRiseMonat - 1] + ' ' + I18N.tx('um') + ' ' + (S.cfg.payRiseArt === 'eur' ? fmtEur(S.cfg.payRiseEur, 0) : fmtDec(S.cfg.payRise * 100, 1) + ' %') : ''} ${I18N.tx('(unter „Daten“ änderbar).')} ${I18N.tx('Eine tatsächliche Erhöhung trägst du einfach als Brutto im jeweiligen Monat ein, ab da rechnet die Prognose damit weiter.')} ${I18N.tx('Sonderzahlungen wie im Vorjahr, skaliert mit dem Brutto.')} ${I18N.tx('Netto mit der Abzugsquote der letzten # Zahlungen (# %).').replace('#', '12').replace('#', fmtDec(M.quote * 100, 1))}
    ${I18N.tx('Zahltag ist')} ${I18N.tx(ZT_TEXT[S.cfg.zahltagModus] || ZT_TEXT.letzte4)}.</p></section>
  <section class="card"><div class="card-h"><h3>Jahresvergleich</h3></div><div class="tablewrap"><table>
    <thead><tr><th>Jahr</th><th class="r">Brutto gesamt</th><th class="r">Netto</th><th class="r">Abzüge</th><th class="r">Ø Monatsgehalt</th><th class="r">Erhöhung im Jahr</th></tr></thead>
    <tbody>${yp.map(q => `<tr class="click ${q.plan ? 'dim' : ''}" data-a="payYear" data-v="${q.v}"><td>${q.v}${q.plan ? ' <span class="chip ty-WE">Plan</span>' : ''}</td><td class="r num">${fmtDec(q.bs)}</td><td class="r num">${fmtDec(q.ne)}</td><td class="r num">${fmtDec((1 - q.ne / q.bs) * 100, 1)} %</td><td class="r num">${fmtDec(q.avg)}</td><td class="r num">${q.rise == null ? '' : fmtDec(q.rise * 100, 1) + ' %'}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ---------- Urlaubsplanung ---------- */
const BRUSHES = [['Urlaub', 'Urlaub'], ['Urlaub - halb', 'Urlaub halb'], ['Zeitausgleich', 'Zeitausgleich'], ['Dienstreise', 'Dienstreise'], ['arbeit', 'Arbeit (löschen)']];
function viewUrlaub() {
  const t = todayKey(), curY = +t.slice(0, 4), startY = +S.cfg.startDatum.slice(0, 4);
  const y = UI.uy, Y = R.years[y], rc = E.cfgAt(S.cfg, y + '-12-31');
  if (!Y) return '<div class="empty">Für dieses Jahr gibt es keine Daten.</div>';
  const rows = R.rows.filter(r => r.k.slice(0, 4) === String(y)), prevEnd = R.map[(y - 1) + '-12-31'];
  const carry = prevEnd ? prevEnd.rest : (y === startY ? S.cfg.startUrlaub : 0), wj = (S.cfg.regeln || []).find(r => r.wechsel && r.ab.slice(0, 4) === String(y)), anspruch = wj ? (E.creditAt(S.cfg, y, E.cfgAt(S.cfg, y + '-01-01').urlaubJahr) + wj.wechsel.rest + (y === startY ? S.cfg.startUrlaub : prevEnd ? prevEnd.rest : 0)) : carry + rc.urlaubJahr;
  const sumU = f => rows.reduce((a, r) => a + (f(r) ? r.ugen : 0), 0);
  const genommen = sumU(r => r.k <= t), geplant = sumU(r => r.k > t);
  const zaTage = f => rows.filter(r => f(r) && r.zagen > 0).length;
  const zaGen = zaTage(r => r.k <= t), zaPlan = zaTage(r => r.k > t);
  const apr = R.map[y + '-04-30'], may = R.map[y + '-05-01'], cap = rc.urlaubVerfall ? R.map[y + '-' + rc.urlaubVerfall] : null;
  const active = !!cap;
  const surplus = active ? cap.lzkIn + cap.verfall : 0;
  const kc = rc.kappungAn !== false && rc.kappungTag ? R.map[y + '-' + rc.kappungTag] : null;
  const capMD = rc.urlaubVerfall ? rc.urlaubVerfall.split('-') : ['05', '01'];
  const past = cap && cap.k <= t;
  const yearsBtn = []; for (let v = startY; v <= curY + 2; v++) yearsBtn.push(v);
  // Mini-Kalender
  const months = Y.months.map((M, i) => {
    const m = i + 1, n = monthDays(y, m), off = E.weekday(E.key(y, m, 1)) - 1; let c = '';
    for (let j = 0; j < off; j++) c += '<span></span>';
    for (let d = 1; d <= n; d++) {
      const k = E.key(y, m, d), r = dayRow(k), paintable = !r.vorStart && r.wd < 6 && !r.hol;
      const half = r.t === 'Urlaub - halb';
      c += `<button class="pd ${tyClass(r.t)} ${k > t && !isWorkType(r.t) && r.wd < 6 ? 'fut' : ''} ${k === t ? 'today' : ''}" data-k="${k}" ${paintable ? 'data-p="1"' : 'tabindex="-1"'} data-a="paintKey" title="${esc(fmtDate(k) + (r.hol ? ' · ' + r.hol : E.TYPES[r.t] && r.t !== 'arbeit' && r.t !== 'WE' ? ' · ' + tyLabel(r.t) : ''))}" aria-label="${esc(fmtDate(k) + ' ' + tyLabel(r.t))}">${d}${half ? '<sup>½</sup>' : ''}</button>`;
    }
    const uCount = M.urlaub, zCount = rows.filter(r => +r.k.slice(5, 7) === m && r.zagen > 0).length;
    return `<div class="pm"><div class="pmh"><b>${MONL[i]}</b><span class="hint">${uCount ? fmtDec(uCount, uCount % 1 ? 1 : 0) + ' U' : ''}${uCount && zCount ? ' · ' : ''}${zCount ? zCount + ' ZA' : ''}</span></div>
      <div class="pg">${WD.map(w => `<i>${w[0]}</i>`).join('')}${c}</div></div>`;
  }).join('');
  let warn = '';
  if (active && surplus > 0.01) {
    warn = past
      ? `Am ${capMD[1]}.${capMD[0]}. waren ${fmtDec(surplus, surplus % 1 ? 1 : 0)} Tage Vorjahresurlaub übrig: ${fmtDec(cap.lzkIn, cap.lzkIn % 1 ? 1 : 0)} gingen ins Langzeitkonto${cap.verfall > 0.01 ? `, <b>${fmtDec(cap.verfall, cap.verfall % 1 ? 1 : 0)} verfielen</b>` : ''}.`
      : `Nach aktueller Planung bleiben am ${capMD[1]}.${capMD[0]}. ${fmtDec(surplus, surplus % 1 ? 1 : 0)} Tage übrig. ${fmtDec(cap.lzkIn, cap.lzkIn % 1 ? 1 : 0)} gehen ins Langzeitkonto${cap.verfall > 0.01 ? `, <b>${fmtDec(cap.verfall, cap.verfall % 1 ? 1 : 0)} Tage verfallen</b>. Plane bis dahin ${fmtDec(cap.verfall, cap.verfall % 1 ? 1 : 0)} weitere Urlaubstage ein.` : '. Es verfällt nichts.'}`;
  }
  return `
  <div class="nav"><h2>Kalender</h2><div class="seg" role="group" aria-label="Jahr">${yearsBtn.map(v => `<button data-a="uyear" data-v="${v}" aria-pressed="${v === y}">${v}</button>`).join('')}</div></div>
  ${warn ? `<div class="banner" style="margin:0"><span>${warn}</span></div>` : ''}
  <div class="stats">
    <div class="stat"><small>Anspruch ${y}</small><b>${fmtDec(anspruch, anspruch % 1 ? 1 : 0)}</b><span>${fmtDec(carry, carry % 1 ? 1 : 0)} Vorjahr + ${fmtDec(rc.urlaubJahr, 0)} neu am 1.1.</span></div>
    <div class="stat"><small>Urlaub genommen / geplant</small><b>${fmtDec(genommen, genommen % 1 ? 1 : 0)} / ${fmtDec(geplant, geplant % 1 ? 1 : 0)}</b><span>Tage, inkl. halbe Tage</span></div>
    <div class="stat"><small>Rest zum Jahresende</small><b>${fmtDec(Y.tot.rest, Y.tot.rest % 1 ? 1 : 0)}</b><span>${active && may ? 'nach ' + capMD[1] + '.' + capMD[0] + '.: ' + fmtDec(may.rest, may.rest % 1 ? 1 : 0) + ' Tage' : 'Tage'}</span></div>
${rc.urlaubVerfall ? `    <div class="stat"><small>Langzeitkonto</small><b>${fmtDec(Y.tot.lzk, Y.tot.lzk % 1 ? 1 : 0)}</b><span>Tage am Jahresende${active && cap.lzkIn ? ' · +' + fmtDec(cap.lzkIn, 0) + ' am ' + capMD[1] + '.' + capMD[0] + '.' : ''}</span></div>` : ''}</div>
  <section class="card">
    <div class="card-h"><h3>Abwesenheiten einplanen</h3>
      <div class="seg" role="group" aria-label="Pinsel">${BRUSHES.map(([v, l]) => `<button data-a="brush" data-v="${esc(v)}" aria-pressed="${UI.brush === v}">${l}</button>`).join('')}</div></div>
    <p class="hint" style="margin:0 0 12px">Tag anklicken oder mit gedrückter Maustaste darüberziehen. Ein zweiter Klick auf einen belegten Tag nimmt ihn zurück. Wochenenden und Feiertage sind gesperrt. 24.12. und 31.12. zählen automatisch als halber Urlaubstag.</p>
    <div class="pms" id="paintArea">${months}</div>
    <div class="legend" style="margin-top:12px"><span><i class="ty-Urlaub"></i>Urlaub</span><span><i class="ty-Zeitausgleich"></i>Zeitausgleich</span><span><i class="ty-Dienstreise"></i>Dienstreise</span><span><i class="ty-Feiertag"></i>Feiertag</span><span><i class="ty-WE"></i>Wochenende</span><span>Gestrichelt: noch geplant · ½ halber Tag</span></div>
  </section>
  <div class="grid2">
    <section class="card"><div class="card-h"><h3>Resturlaub im Jahresverlauf</h3><span class="hint">Tage</span></div><div class="chartbox" id="chRest"></div>
      ${rc.urlaubVerfall ? `<p class="hint" style="margin:8px 0 0">Am ${capMD[1]}.${capMD[0]}. fällt der Vorjahresurlaub über ${fmtDec(rc.urlaubJahr, 0)} Tage weg. Bis zu ${fmtDec(rc.lzkMax, 0)} Tage davon gehen ins Langzeitkonto, der Rest verfällt.</p>` : ''}</section>
    <section class="card"><div class="card-h"><h3>Zeitausgleich ${y}</h3></div>
      <div class="calc" style="margin-top:0;border:0;padding-top:0"><div><small>Genommen</small><b>${zaGen} Tage</b></div><div><small>Geplant</small><b>${zaPlan} Tage</b></div><div><small>Stunden gesamt</small><b>${fmtT((zaGen + zaPlan) * S.cfg.soll)}</b></div></div>
      ${kc ? `<p style="margin:14px 0 0">Zeitkonto am ${kc.k.slice(8)}.${kc.k.slice(5, 7)}.: <b class="num">${fmtT(kc.konto + kc.loss)} h</b> vor der Kappung.</p>
      <p class="${kc.loss > 0.01 ? 'warn' : 'hint'}" style="margin:4px 0 0">${kc.loss > 0.01 ? `Auf ${fmtT(rc.kappungMax)} h gekappt: ${fmtT(kc.loss)} h verfallen. Das sind ${fmtDec(kc.loss / S.cfg.soll, 1)} Tage Zeitausgleich, die du vorher noch einplanen kannst.` : 'Nach aktueller Planung verfällt nichts.'}</p>` : ''}
    </section>
  </div>`;
}

/* ---------- Ereignisse ---------- */
const go = k => { UI.date = k; UI.tab = 'heute'; render(); window.scrollTo(0, 0); };
const actions = {
  farbe: el => { S.cfg.farbe = el.dataset.v; commit(); },
  tab: el => { let v = el.dataset.v; if (v === 'daten') { v = 'einst'; UI.sub = 'daten'; } UI.tab = v; render(); window.scrollTo(0, 0); },
  sub: el => { UI.sub = el.dataset.v; render(); },
  day: el => { UI.date = E.addDays(UI.date, +el.dataset.n); UI.year = +UI.date.slice(0, 4); render(); },
  today: () => { UI.date = todayKey(); render(); },
  goto: el => go(el.dataset.k),
  setOrt: el => setDay(UI.date, { o: el.dataset.v }),
  setOrtFolge: el => setDay(UI.date, { hoZ: el.dataset.v === 'ho' ? 'ho' : '' }),
  applyRangeOrt: () => rangeOrt(false),
  clearRangeOrt: () => rangeOrt(true),
  setType: el => setDay(UI.date, { t: normType(UI.date, el.dataset.v) }),
  payStart: () => { S.pay = S.pay || {}; S.pay[todayKey().slice(0, 7)] = { b: 0 }; save(); render(); },
  payYear: el => { UI.payYear = +el.dataset.v; render(); },
  svAdd: () => { ensureSoll(); const v = S.cfg.sollVerlauf, last = v[v.length - 1]; let ab = todayKey(); if (ab <= last.ab) ab = E.addDays(last.ab, 1); v.push({ ab, soll: last.soll }); commit(); },
  rgAdd: () => { const g = S.cfg.regeln = S.cfg.regeln || [], last = g.length ? g[g.length - 1] : null; const src = E.cfgAt(S.cfg, '9999-12-31'); let ab = todayKey(); if (last && ab <= last.ab) ab = E.addDays(last.ab, 1); const r = { ab }; E.RULE_KEYS.forEach(f => { r[f] = src[f]; }); if (r.kappungAn === undefined) r.kappungAn = true; g.push(r); commit(); },
  wizOpen: () => { const rc = E.cfgAt(S.cfg, todayKey()), ab = todayKey(); UI.wiz = { ab, urlaubJahr: rc.urlaubJahr, rest: wizDefaults(ab, rc.urlaubJahr), konto: 0, lzk: 0, soll: S.cfg.soll }; render(); },
  wizCancel: () => { UI.wiz = null; render(); },
  wizApply: () => {
    const w = UI.wiz; if (!w) return; ensureSoll();
    const last = (S.cfg.regeln || []).length ? S.cfg.regeln[S.cfg.regeln.length - 1].ab : S.cfg.startDatum;
    if (!w.ab || w.ab <= S.cfg.startDatum || w.ab <= last) { toast('Das Datum muss nach dem Startdatum und nach der letzten Regeländerung liegen.'); return; }
    if (!(w.soll > 0)) { toast('Das Soll pro Arbeitstag fehlt.'); return; }
    const src = E.cfgAt(S.cfg, w.ab), r = { ab: w.ab };
    E.RULE_KEYS.forEach(f => { r[f] = src[f]; });
    if (r.kappungAn === undefined) r.kappungAn = true;
    r.urlaubJahr = w.urlaubJahr; r.wechsel = { rest: w.rest, konto: w.konto, lzk: w.lzk };
    S.cfg.regeln = (S.cfg.regeln || []).concat(r);
    S.cfg.sollVerlauf = S.cfg.sollVerlauf.filter(x => x.ab !== w.ab).concat({ ab: w.ab, soll: w.soll });
    UI.wiz = null; commit(); toast('Jobwechsel eingetragen.');
  },
  rgDel: el => { S.cfg.regeln.splice(+el.dataset.i, 1); commit(); },
  svDel: el => { S.cfg.sollVerlauf.splice(+el.dataset.i, 1); commit(); },
  uyear: el => { UI.uy = +el.dataset.v; render(); },
  brush: el => { UI.brush = el.dataset.v; render(); },
  paintKey: el => { if (lastPT === 'touch' || lastDetail === 0) { paintBegin(el.dataset.k); paintEnd(); } },
  stampIn: () => setDay(UI.date, { s: nowStr() }),
  stampOut: () => setDay(UI.date, { e: nowStr() }),
  addAct: () => {
    const f = UI.form, k = UI.date, d = S.days[k] || {};
    const acts = S.acts.filter(a => a.d === k).sort((a, b) => a.s.localeCompare(b.s));
    const s = f.s || (acts.length ? acts[acts.length - 1].e : d.s) || '';
    if (!s || !f.e) { toast('Von und Bis eintragen. Mit „Timer“ startet die Zeit ab jetzt.'); return; }
    if (H(f.e) <= H(s)) { toast('Bis muss nach Von liegen.'); return; }
    S.acts.push({ id: newId(), d: k, s, e: f.e, u: f.u, cat: f.cat, w: f.w, sys: f.sys, pn: f.pn || '', th: f.th });
    UI.form = { s: '', e: '', u: '', cat: '', w: '', sys: '', pn: '', th: '' };
    commit(); setTimeout(() => { const el = $('#f_e'); if (el) el.focus(); }, 0);
  },

    <button class="btn primary" id="updInst">Installieren</button><a class="btn" id="updDl" target="_blank" rel="noopener">Herunterladen</a><button class="btn" id="updNotes">Was ist neu?</button><button class="btn" id="updSkip">Später</button>

/* Neue Version direkt über die bestehende Datei schreiben (Chrome/Edge): Datei wählen, bestätigen, fertig.
   Die Datei kommt von raw.githubusercontent.com (Branch "dist", wird beim Release gebaut), weil GitHubs
   Release-Download im Browser wegen CORS nicht lesbar ist. Der Dateidialog kommt zuerst (Klick-Berechtigung). */
async function installUpdate(info) {
  const fallback = msg => { alert(I18N.tx('Direktes Überschreiben ging nicht. Die Datei wird stattdessen heruntergeladen.') + (msg ? ' (' + msg + ')' : '')); window.open(info.asset || info.url, '_blank'); };
  let h;
  try { h = await window.showSaveFilePicker({ suggestedName: (() => { const f = decodeURIComponent(location.pathname.split('/').pop() || ''); return /\.html?$/i.test(f) ? f : 'taktbuch.html'; })(), types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }] }); }
  catch (e) { if (e && e.name === 'AbortError') return; fallback(e && e.message); return; }
  try {
    const r = await fetch('https://raw.githubusercontent.com/' + REPO + '/dist/taktbuch.html?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    if (!txt.includes("__ZW_VERSION='" + info.tag.replace(/^v/, '') + "'")) throw new Error(I18N.tx('Die neue Datei ist noch nicht bereit, bitte in ein paar Minuten erneut versuchen.'));
    if (txt.length < 100000) throw new Error('Datei unvollständig');
    let old = ''; try { old = await (await h.getFile()).text(); } catch (e) { }
    const size = new Blob([txt]).size;
    const put = async t => { const w = await h.createWritable(); await w.write(t); await w.close(); };
    await put(txt);
    const chk = await h.getFile();   // nachprüfen, sonst alte Version zurückschreiben
    if (chk.size !== size) { try { if (old) await put(old); } catch (e) { } throw new Error(I18N.tx('Schreiben unvollständig, die alte Version wurde wiederhergestellt.')); }
    alert(I18N.tx('Aktualisiert. Die Seite wird jetzt neu geladen.')); location.reload();
  } catch (e) { fallback(e && e.message); }
}
async function checkUpdate(manual) {
  const st = $('#updState');
  const say = t => { if (st) st.textContent = t; };
  if (!REPO) { say('In dieser Version ist keine Update-Prüfung eingerichtet.'); return; }
  let info = null; try { info = JSON.parse(ls.get('zeitwerk-upd-info') || 'null'); } catch (e) { }
  const last = +ls.get('zeitwerk-upd-last') || 0;
  if (!manual && Date.now() - last < 36e5) { showUpdate(info); return; }
  say('prüfe …');
  try {
    const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch('https://api.github.com/repos/' + REPO + '/releases/latest', { signal: ctl.signal, headers: { Accept: 'application/vnd.github+json' } });
    clearTimeout(to);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json(), as = (j.assets || []).find(a => /\.html$/i.test(a.name));
    info = { tag: j.tag_name, url: j.html_url, asset: as ? as.browser_download_url : '', aid: as ? as.id : 0, notes: String(j.body || '').slice(0, 4000) };

    if (manual) { ls.set('zeitwerk-upd-skip', ''); say(isNewer(info.tag, VERSION) ? 'Neue Version ' + info.tag.replace(/^v/, '') + ' verfügbar.' : 'Du hast die aktuelle Version.'); }
    showUpdate(info);
  } catch (e) { say(manual ? 'Prüfung nicht möglich (offline oder Zugriff gesperrt).' : ''); if (!manual) ls.set('zeitwerk-upd-last', String(Date.now())); /* nach Fehler in 1 Stunde erneut versuchen */ showUpdate(info); }
