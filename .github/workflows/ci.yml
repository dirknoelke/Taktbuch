name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 build.py
      - run: node tests/engine.test.js
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 tests/ui.py dist/taktbuch.html
      - name: Update-Test gegen das letzte Release
        run: |
          git fetch --depth 1 origin dist
          git show FETCH_HEAD:taktbuch.html > /tmp/prev.html
          python3 tests/upgrade.py /tmp/prev.html dist/taktbuch.html
